<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inclusivity AI - Admin Access</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;600;800&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; overflow: hidden; background-color: #020617 !important; color: #f1f5f9 !important; }
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: fadeIn 0.8s ease-out;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes float { 0% { transform: translateY(0) rotate(0); } 100% { transform: translateY(-120vh) rotate(360deg); } }
        .particle { position: absolute; background: white; border-radius: 50%; animation: float linear infinite; opacity: 0.3; box-shadow: 0 0 10px 2px rgba(255,255,255,0.2); }
        .animate-blob { animation: blob 10s infinite; filter: blur(100px); opacity: 0.5; }
        @keyframes blob {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 text-slate-100">

    <!-- ANTIGRAVITY BG -->
    <div id="particle-field" class="fixed inset-0 z-0 pointer-events-none" style="background-color: #020617;"></div>
    <div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-indigo-600/30 rounded-full blur-[120px] animate-blob"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-blue-600/30 rounded-full blur-[120px] animate-blob [animation-delay:2s]"></div>
    </div>

    <!-- AUTH CARD -->
    <div id="login-container" class="relative z-10 w-full max-w-[420px] glass-card p-10 rounded-[3rem] shadow-2xl transition-all duration-500">
        <div class="text-center mb-10">
            <div class="w-20 h-20 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-3xl mx-auto flex items-center justify-center text-white mb-6 shadow-2xl">
                <i class='bx bxs-shield-quarter text-4xl'></i>
            </div>
            <h2 class="text-[10px] font-black text-indigo-400 uppercase tracking-[0.4em] mb-2">Secure Gateway</h2>
            <h1 class="text-3xl font-black text-white tracking-tight">System Access</h1>
            <p class="text-[11px] text-slate-400 font-medium mt-2">Restricted Area. Authorized personnel only.</p>
        </div>

        <form id="admin-login-form" class="space-y-6">
            <div class="space-y-2">
                <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest px-1">Admin Username</label>
                <div class="relative group">
                    <i class='bx bxs-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 transition-colors group-focus-within:text-indigo-400'></i>
                    <input type="text" id="username" placeholder="Enter username" class="w-full bg-white/5 border border-white/10 rounded-2xl py-4 pl-12 pr-4 text-sm font-medium focus:outline-none focus:border-indigo-500/50 focus:ring-1 focus:ring-indigo-500/30 transition-all" required>
                </div>
            </div>

            <div class="space-y-2">
                <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest px-1">Password</label>
                <div class="relative group">
                    <i class='bx bxs-lock-alt absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 transition-colors group-focus-within:text-indigo-400'></i>
                    <input type="password" id="password" placeholder="••••••••" class="w-full bg-white/5 border border-white/10 rounded-2xl py-4 pl-12 pr-4 text-sm font-medium focus:outline-none focus:border-indigo-500/50 focus:ring-1 focus:ring-indigo-500/30 transition-all" required>
                </div>
            </div>

            <div id="error-box" class="hidden text-center p-3 rounded-xl bg-red-500/10 border border-red-500/20 text-red-400 text-[10px] font-bold uppercase tracking-wider">
                Invalid credentials or Backend unreachable.
            </div>

            <button type="submit" id="submit-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-black py-4 rounded-2xl text-xs uppercase tracking-[0.2em] shadow-xl shadow-indigo-600/20 transition-all active:scale-95 flex items-center justify-center gap-2">
                Authenticate <i class='bx bx-right-arrow-alt text-lg'></i>
                <span id="spinner" class="animate-spin h-3 w-3 border-2 border-white border-t-transparent rounded-full hidden"></span>
            </button>
        </form>
    </div>

    <!-- DASHBOARD CARD (HIDDEN BY DEFAULT) -->
    <div id="dashboard-container" class="relative z-10 w-full max-w-[500px] glass-card p-10 rounded-[3rem] shadow-2xl transition-all duration-500 hidden opacity-0 scale-95">
        <div class="flex items-center justify-between mb-8">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-red-500/20 rounded-2xl flex items-center justify-center text-red-400">
                    <i class='bx bxs-terminal text-2xl'></i>
                </div>
                <div>
                    <h2 class="text-xs font-black text-red-400 uppercase tracking-widest">Admin Control</h2>
                    <h1 class="text-xl font-black text-white">System Panel</h1>
                </div>
            </div>
            <a href="../" class="bg-white/5 hover:bg-white/10 px-4 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest text-slate-400 hover:text-white transition-all">Exit</a>
        </div>

        <div class="space-y-6">
            <div class="bg-black/40 rounded-2xl p-5 border border-white/5 font-mono text-[10px] text-emerald-400 h-40 overflow-y-auto custom-scrollbar" id="admin-log">
                &gt; Secure session initialized...<br>
                &gt; Awaiting operator input...<br>
            </div>

            <div class="grid grid-cols-1 gap-4">
                <button id="admin-load-data-btn" class="flex items-center justify-between p-5 rounded-2xl bg-white/5 border border-white/5 hover:bg-white/10 hover:border-indigo-500/30 transition-all group">
                    <div class="flex items-center gap-4">
                        <i class='bx bx-refresh text-2xl text-indigo-400 group-hover:rotate-180 transition-transform duration-500'></i>
                        <span class="text-xs font-black uppercase tracking-widest">Reload Root Data</span>
                    </div>
                    <i class='bx bx-chevron-right text-slate-600 group-hover:text-white transition-colors'></i>
                </button>

                <button id="admin-append-data-btn" class="flex items-center justify-between p-5 rounded-2xl bg-white/5 border border-white/5 hover:bg-white/10 hover:border-emerald-500/30 transition-all group">
                    <div class="flex items-center gap-4">
                        <i class='bx bx-plus-circle text-2xl text-emerald-400 group-hover:scale-110 transition-transform'></i>
                        <span class="text-xs font-black uppercase tracking-widest">Append New Knowledge</span>
                    </div>
                    <i class='bx bx-chevron-right text-slate-600 group-hover:text-white transition-colors'></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://chatbot-3-hpx2.onrender.com';
        let authToken = null;
        
        // Particle Init
        const field = document.getElementById('particle-field');
        for(let i=0; i<40; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + '%';
            p.style.top = Math.random() * 100 + '%';
            const size = Math.random() * 3 + 1;
            p.style.width = size + 'px'; p.style.height = size + 'px';
            p.style.animationDuration = Math.random() * 20 + 20 + 's';
            p.style.animationDelay = Math.random() * 10 + 's';
            field.appendChild(p);
        }

        const logToAdmin = (msg) => {
            const el = document.getElementById('admin-log');
            if (el) {
                el.innerHTML += `&gt; ${msg}<br>`;
                el.scrollTop = el.scrollHeight;
            }
        };

        const loginForm = document.getElementById('admin-login-form');
        const loginContainer = document.getElementById('login-container');
        const dashboardContainer = document.getElementById('dashboard-container');
        const errorBox = document.getElementById('error-box');
        const spinner = document.getElementById('spinner');
        const submitBtn = document.getElementById('submit-btn');

        loginForm.onsubmit = async (e) => {
            e.preventDefault();
            errorBox.classList.add('hidden');
            spinner.classList.remove('hidden');
            submitBtn.disabled = true;

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch(`${API_URL}/api/admin/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await res.json();
                if (res.ok && data.token) {
                    authToken = data.token;
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('email', data.email);
                    
                    // Transition to Dashboard
                    loginContainer.classList.add('opacity-0', 'scale-95');
                    setTimeout(() => {
                        loginContainer.classList.add('hidden');
                        dashboardContainer.classList.remove('hidden');
                        setTimeout(() => {
                            dashboardContainer.classList.remove('opacity-0', 'scale-95');
                            logToAdmin(`Operator identified as ${data.email}`);
                        }, 50);
                    }, 500);
                } else {
                    errorBox.innerText = data.error || (res.status === 404 ? "Route not live yet (404)." : "Invalid Credentials.");
                    errorBox.classList.remove('hidden');
                }
            } catch (err) {
                errorBox.innerText = "Network error. Check CORS settings.";
                errorBox.classList.remove('hidden');
            } finally {
                spinner.classList.add('hidden');
                submitBtn.disabled = false;
            }
        };

        // Dashboard Actions
        document.getElementById('admin-load-data-btn').onclick = async () => {
            logToAdmin('Requesting root data reload...');
            try {
                const res = await fetch(`${API_URL}/api/admin/load-data`, {
                    method: 'POST',
                    headers: { 'x-auth-token': authToken }
                });
                const data = await res.json();
                if (res.ok) logToAdmin(`Success: ${data.status}`);
                else logToAdmin(`Error: ${data.error || 'Operation failed'}`);
            } catch (e) { logToAdmin('Error: Connection lost'); }
        };

        document.getElementById('admin-append-data-btn').onclick = async () => {
            logToAdmin('Requesting knowledge append...');
            try {
                const res = await fetch(`${API_URL}/api/admin/append-data`, {
                    method: 'POST',
                    headers: { 'x-auth-token': authToken }
                });
                const data = await res.json();
                if (res.ok) logToAdmin(`Success: ${data.status}`);
                else logToAdmin(`Error: ${data.error || 'Operation failed'}`);
            } catch (e) { logToAdmin('Error: Connection lost'); }
        };
    </script>
</body>
</html>
