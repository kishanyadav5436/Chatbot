<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inclusivity AI - Admin Access</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../style.css">
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-slate-800 via-slate-900 to-black z-0"></div>

    <!-- Login Panel -->
    <div id="login-panel" class="relative z-10 bg-slate-800/80 backdrop-blur-xl w-full max-w-md rounded-3xl shadow-2xl overflow-hidden border border-slate-700 p-8 transform transition-all duration-500">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl mx-auto flex items-center justify-center text-white mb-4 shadow-lg">
                <i class="bi bi-shield-lock-fill text-3xl"></i>
            </div>
            <h2 class="text-2xl font-black text-white uppercase tracking-wider">System Access</h2>
            <p class="text-slate-400 text-sm mt-2">Restricted Area. Authorized personnel only.</p>
        </div>

        <form id="admin-login-form" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">Admin Username</label>
                <div class="relative">
                    <i class="bi bi-person absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
                    <input type="text" id="username" class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl py-3 pl-10 pr-4 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all" placeholder="Enter username" required>
                </div>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">Password</label>
                <div class="relative">
                    <i class="bi bi-key absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
                    <input type="password" id="password" class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl py-3 pl-10 pr-4 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all" placeholder="••••••••" required>
                </div>
            </div>
            
            <div id="error-msg" class="text-red-400 text-xs font-bold text-center hidden">Invalid credentials.</div>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl py-3 mt-4 transition-colors">
                Authenticate <i class="bi bi-arrow-right ml-2"></i>
            </button>
        </form>
    </div>

    <!-- Dashboard Panel -->
    <div id="dashboard-panel" class="relative z-10 bg-slate-900 w-full max-w-lg rounded-[2rem] shadow-2xl overflow-hidden border border-red-500/30 hidden">
        <div class="p-6 border-b border-white/10 flex justify-between items-center bg-red-950/40">
            <div class="flex items-center gap-3">
                <i class="bi bi-terminal-fill text-red-500 text-xl"></i>
                <h3 class="text-xl font-black tracking-widest uppercase text-white">System Admin</h3>
            </div>
            <a href="/" class="text-white/50 hover:text-white transition-colors text-xs font-bold uppercase tracking-widest">Back to Chat</a>
        </div>
        <div class="p-6 space-y-4">
            <div class="bg-black/50 rounded-xl p-4 font-mono text-[10px] text-green-400 mb-6 h-32 overflow-y-auto" id="admin-log">
                &gt; System initialized...<br>
                &gt; Awaiting command...<br>
            </div>
            
            <h4 class="text-xs font-black text-slate-400 uppercase tracking-widest mb-2 border-b border-white/10 pb-2">Data Operations</h4>
            <div class="grid grid-cols-1 gap-3 hover:gap-4 transition-all">
                <button id="admin-load-data-btn" class="w-full flex items-center justify-between p-4 rounded-xl bg-slate-800 hover:bg-slate-700 border border-white/5 text-white transition-all group">
                    <div class="flex items-center gap-3">
                        <i class="bi bi-database-down text-blue-400 group-hover:scale-110 transition-transform"></i>
                        <span class="text-xs font-bold uppercase tracking-wider">Reload Root Data</span>
                    </div>
                    <i class="bi bi-chevron-right text-white/30 group-hover:text-white transition-colors"></i>
                </button>
                <button id="admin-append-data-btn" class="w-full flex items-center justify-between p-4 rounded-xl bg-slate-800 hover:bg-slate-700 border border-white/5 text-white transition-all group">
                    <div class="flex items-center gap-3">
                        <i class="bi bi-database-add text-green-400 group-hover:scale-110 transition-transform"></i>
                        <span class="text-xs font-bold uppercase tracking-wider">Append New Data</span>
                    </div>
                    <i class="bi bi-chevron-right text-white/30 group-hover:text-white transition-colors"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2"></div>

    <script>
        const API_URL = 'https://chatbot-3-hpx2.onrender.com';
        let authToken = null;

        const loginForm = document.getElementById('admin-login-form');
        const loginPanel = document.getElementById('login-panel');
        const dashboardPanel = document.getElementById('dashboard-panel');
        const errorMsg = document.getElementById('error-msg');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            errorMsg.classList.add('hidden');

            try {
                const res = await fetch(`${API_URL}/api/admin/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (res.ok) {
                    const data = await res.json();
                    authToken = data.token;
                    
                    // Transition UI
                    loginPanel.style.transform = 'scale(0.95)';
                    loginPanel.style.opacity = '0';
                    setTimeout(() => {
                        loginPanel.style.display = 'none';
                        dashboardPanel.classList.remove('hidden');
                        logToAdmin(`Admin access granted to ${data.email}`);
                    }, 500);
                } else {
                    const data = await res.json().catch(() => ({}));
                    if (res.status === 404) {
                        errorMsg.innerText = 'Error 404: Admin endpoint not found on server. Please redeploy.';
                    } else {
                        errorMsg.innerText = data.error || 'Invalid credentials.';
                    }
                    errorMsg.classList.remove('hidden');
                }
            } catch (err) {
                console.error('Login Error:', err);
                errorMsg.innerText = 'Connection error. Check if backend is alive / CORS.';
                errorMsg.classList.remove('hidden');
            }
        });

        // Admin functionality
        const logToAdmin = (msg) => {
            const el = document.getElementById('admin-log');
            if (el) {
                el.innerHTML += `&gt; ${msg}<br>`;
                el.scrollTop = el.scrollHeight;
            }
        };

        const adminLoadBtn = document.getElementById('admin-load-data-btn');
        if (adminLoadBtn) {
            adminLoadBtn.onclick = async () => {
                logToAdmin('Requesting root data reload...');
                try {
                    const res = await fetch(`${API_URL}/api/admin/load-data`, {
                        method: 'POST',
                        headers: { 'x-auth-token': authToken }
                    });
                    const data = await res.json();
                    if (res.ok) logToAdmin(`Success: ${data.status}`);
                    else logToAdmin(`Error: ${data.error || 'Failed'}`);
                } catch (e) { logToAdmin(`Error: ${e.message}`); }
            };
        }

        const adminAppendBtn = document.getElementById('admin-append-data-btn');
        if (adminAppendBtn) {
            adminAppendBtn.onclick = async () => {
                logToAdmin('Requesting new data append...');
                try {
                    const res = await fetch(`${API_URL}/api/admin/append-data`, {
                        method: 'POST',
                        headers: { 'x-auth-token': authToken }
                    });
                    const data = await res.json();
                    if (res.ok) logToAdmin(`Success: ${data.status}`);
                    else logToAdmin(`Error: ${data.error || 'Failed'}`);
                } catch (e) { logToAdmin(`Error: ${e.message}`); }
            };
        }
    </script>
</body>
</html>
